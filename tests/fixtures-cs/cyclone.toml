# The fixture project, laid out the way a real C# project is: `src/` holds
# the annotated model, and the generated tree lands beside it at
# `src/generated/` - the C# counterpart of tests/fixtures-go/cyclone.toml.
src = "src"
out = "src/generated"

# No `model_path`: the default reads it off the `namespace` the source
# declares, exactly as the Rust and Go backends read theirs off the source
# layout / `go.mod`.
