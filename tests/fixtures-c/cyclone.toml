# The fixture project, laid out the way a real C project is: `src/` holds
# the annotated models, and the generated tree lands beside it at
# `src/generated/` - the C counterpart of tests/fixtures-cpp/cyclone.toml.
src = "src"
out = "src/generated"

# No model_path: this backend has no namespace for it to override at all -
# the #include path a generated header needs is always the model's own
# source path regardless - see generator::c::ModelLocation's module docs.
